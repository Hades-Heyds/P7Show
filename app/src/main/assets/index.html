<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P7 SHOW</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Microsoft YaHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: transparent; } /* B项：NATIVE 混合渲染时透出下层 Filament 场景背景（深色 fog 兜底），保证歌词从车模轮廓外可读 */
  /* v1.55：充电场景背景——CSS 青绿径向渐变（深墨绿 #0a0f0d 基底 + 中心青绿光晕），画布 alpha 透明叠加其上；
     进入充电场景时 body 挂 charge-scene 类，离开/退出时移除恢复普通场景背景 */
  body.charge-scene {
    background: radial-gradient(circle at 50% 92.5%, rgba(80,170,140,1.1) 0%, rgba(50,105,85,0.7) 32%, #0a0f0d 55%) #0a0f0d;
  }
  #container { position: fixed; inset: 0; }
  #container canvas { display: block; }
  /* v1.48：左上角续航/电量模块（时间上方、参考图样式）：无底色左对齐，主数值大字号深灰 + km 小字，
     下方绿色电量进度条 + 电量百分比；不显示能耗；pointer-events:none 不拦截 3D 操作 */
  #rangeModule {
    position: fixed;
    top: 2.2vw; /* 安全区基准值，applyStatusBarSafeArea 会在此基础上叠加状态栏偏移 */
    left: 2.4vw;
    z-index: 5;
    color: #ffffff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: none;
    border: none;
    box-shadow: none;
    text-shadow: none;
    line-height: 1.05;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #rangeMain { display: flex; align-items: baseline; gap: 0.9vw; }
  #rangeVal { font-size: 4.08vw; font-weight: 600; letter-spacing: 0.02em; } /* v1.51：字号 0.6 倍（6.8→4.08） */
  #rangeUnit { font-size: 2.4vw; font-weight: 400; color: rgba(255,255,255,0.75); }
  #rangeSub { display: flex; align-items: center; gap: 1vw; margin-top: 0.8vw; }
  #rangeBar {
    width: 22.5vw; /* v1.51：长度不变（22.5vw），高度减半 */
    height: 0.65vw;
    border-radius: 0.325vw;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    flex: none;
  }
  #rangeBarFill {
    height: 100%;
    width: 0%;
    border-radius: 0.325vw;
    background: #00c853;
    transition: width 0.6s ease;
  }
  #rangeBattPct { margin-left: 2vw; font-size: 2.64vw; font-weight: 500; opacity: 0.92; } /* v1.49：百分比移至主行续航值右侧，与 km 间隔 2vw；v1.51：字号 0.6 倍（2.2→1.32）；v1.52：改为 1 倍大（2.64vw） */
  /* 左上角 24 小时制数字时钟（点击弹出设置浮窗）：白色无衬线、无背景/边框/阴影 */
  #clock {
    position: fixed;
    top: 15vw; /* v1.67：层级改为 rangeModule → lightCard → clock；时钟随红绿灯卡上移（lightCard 顶 10vw + 高约 4vw），保持下方间距约 1vw */
    left: 2.4vw;
    z-index: 5;
    color: #ffffff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: none;
    border: none;
    box-shadow: none;
    text-shadow: none;
    line-height: 1.12;
    cursor: pointer;
    pointer-events: auto; /* 仅时钟区域可点，不拦截其余 3D 操作 */
    -webkit-user-select: none;
    user-select: none;
  }
  #clockTime { font-size: 5.6vw; font-weight: 600; letter-spacing: 0.05em; } /* v1.52：时间字号改为与日期相同（7→5.6vw） */
  /* v1.51：小米车机风格竖排日期（时间下方：星期 + 月/日，左对齐；星期最小、日期次之、时间最大） */
  #clockDate { display: flex; flex-direction: column; gap: 0.3vw; opacity: 0.92; margin-top: 0.6vw; }
  #clockWeek { font-size: 2.6vw; font-weight: 400; }
  #clockDay { font-size: 5.6vw; font-weight: 600; } /* 日期基准 = 原时间字号 7vw × 0.8 */
  /* v1.65：充电信息模块（红绿灯上方、续航条下方）：充电功率/电压/电流；字号与电量百分比 #rangeBattPct 一致（2.64vw）；仅充电场景显示 */
  #chargeInfoModule {
    position: fixed;
    left: 2.4vw;
    bottom: calc(20vh + 12px); /* v1.67：移至底部频谱条（#freqCanvas 高约 1/5 屏高，由 sizeFreqCanvas 同步）上方 12px；原 v1.65 位于续航条下方、红绿灯卡上方 */
    z-index: 25; /* 高于频谱条 z-index 20，确保显示在其上沿之上 */
    display: flex;
    align-items: baseline;
    gap: 2.4vw;
    color: #ffffff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 1.58vw; /* v1.66：缩小为原 2.64vw 的 60% */
    font-weight: 500;
    background: none;
    border: none;
    box-shadow: none;
    text-shadow: none;
    line-height: 1.1;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #chargeInfoModule .chargeInfoItem { display: flex; align-items: baseline; gap: 0.8vw; }
  #chargeInfoModule .chargeInfoLabel { font-size: 1.02vw; /* v1.66：标签随数值同步缩小 60% */ font-weight: 400; opacity: 0.7; }

  /* 红绿灯倒计时卡片（路径A：SDK 原生层推送 window.__lightData 驱动；未就绪显示占位） */
  #lightCard {
    position: fixed;
    top: 10vw; /* v1.67：层级改为 rangeModule → lightCard → clock（充电信息已移至底部频谱条上方）；红绿灯卡上移，缩小与续航模块间隙（rangeModule 底约 7.95vw，间隙由 5vw 缩至 2vw） */
    left: 2.4vw;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.7vw;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.4vw;
    padding: 0.7vw 1.2vw;
    font-size: 1.35vw;
    letter-spacing: 0.08vw;
    color: #ffffff; /* v1.46：红绿灯服务字体纯白 */
    line-height: 1.2;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #lightDot {
    width: 1.5vw;
    height: 1.5vw;
    border-radius: 50%;
    background: transparent;
    box-shadow: 0 0 0.6vw rgba(255,255,255,0.35);
    flex: none;
  }
  #lightDot.off { background: rgba(255,255,255,0.25); box-shadow: none; }
  #lightDot.red { background: #ff4d4f; box-shadow: 0 0 0.8vw rgba(255,77,79,0.7); }
  #lightDot.green { background: #52c41a; box-shadow: 0 0 0.8vw rgba(82,196,26,0.7); }
  #lightDot.yellow { background: #f5c518; box-shadow: 0 0 0.8vw rgba(245,197,24,0.7); }
  /* 右上角歌曲信息（歌名大号 + 歌手小号，两行靠右）：只读展示，不拦截 3D 交互 */
  #songMeta {
    position: fixed;
    right: 1.5vw;
    bottom: calc(20vh + 8px); /* 右下方：底部频谱条（约 1/5 屏高）上方，实际位置由 sizeFreqCanvas 同步 */
    z-index: 30;
    text-align: right;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.25;
  }
  #songTitle {
    font-size: 3.6vh; /* 以屏幕纵向为基准：全屏/分屏高度一致，字号不随分屏宽度变化 */
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60vw;
  }
  #songArtist {
    font-size: 2.2vh; /* 以屏幕纵向为基准，与歌名同口径 */
    color: rgba(255,255,255,0.78);
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 40vw;
  }
  #status { position: fixed; left: 2vw; bottom: 2vw; color: rgba(255,255,255,0.55); font-size: 11px; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); z-index: 10; pointer-events: none; opacity: 0.6; } /* 加载说明文字：屏幕最左下方（本轮 UI 微调） */
  #freqCanvas { position: fixed; left: 0; bottom: 0; width: 100%; height: 48px; z-index: 20; pointer-events: none; display: block; }
  #lightBtn {
    display: none; /* 主界面悬浮按钮：不再显示（保留 DOM 与点击逻辑供浮窗复用） */
    position: fixed; left: 1.8vw; top: calc(50% - 9.3vw); z-index: 30;
    background: rgba(20,32,48,0.55);
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 2.2vw;
    padding: 0.9vw 1.8vw;
    font-size: 1.45vw;
    letter-spacing: 0.12vw;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.35s ease;
  }
  #lightBtn.on {
    background: rgba(255,210,120,0.26);
    border-color: rgba(255,210,120,0.75);
    color: #ffd98a;
  }
  #lightBtn.disabled { opacity: 0.4; cursor: default; }
  #sceneBtns {
    display: none; /* 主界面悬浮按钮组：不再显示（保留 DOM 与点击逻辑供浮窗复用） */
    flex-direction: column;
    gap: 0.9vw;
    position: fixed; left: 1.8vw; top: calc(50% - 4.5vw);
    z-index: 30;
    opacity: 1;
    transition: opacity 0.35s ease;
  }
  /* 场景/灯光按钮全局样式（主界面隐藏按钮与左侧浮窗共用） */
  .skyBtn {
    background: rgba(20,32,48,0.55);
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 2.2vw;
    padding: 0.9vw 1.8vw;
    font-size: 1.45vw;
    letter-spacing: 0.12vw;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .skyBtn.active, .skyBtn.on {
    background: rgba(255,210,120,0.26);
    border-color: rgba(255,210,120,0.75);
    color: #ffd98a;
  }
  /* ---------- 左侧滑出式设置浮窗（drawer） ---------- */
  /* v28：三分屏窄屏适配——抽屉收窄（60vw 而非 33vw，避免占满窄窗口）、字号略增保证可读 */
  body.split-13 #drawer { width: 60vw; }
  body.split-13 #drawer .skyBtn { font-size: 1.7vw; padding: 1.1vw 0.3vw; }
  body.split-13 #drawerSceneWrap .skyBtn,
  body.split-13 #paintPaletteRow .skyBtn,
  body.split-13 #paintPresetRow .skyBtn,
  body.split-13 #doorSwitchGrid .skyBtn,
  body.split-13 #doorSwitchAllRow .skyBtn { font-size: 1.6vw; padding: 1.1vw 0.4vw; }
  body.split-13 #drawerTitle { font-size: 1.9vw; }
  body.split-13 #customPageTitle { font-size: 2.1vw; }
  body.split-13 #paintPaletteTitle,
  body.split-13 #doorSwitchTitle { font-size: 1.9vw; }
  body.split-13 #viewSwitchTitle { font-size: 1.8vw; }
  #drawer {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 33vw;
    background: rgba(20,32,48,0.85);
    border-radius: 0 2.2vw 2.2vw 0; /* 圆角右缘 */
    z-index: 40; /* 高于 3D 画布与悬浮按钮 */
    transform: translateX(-100%);
    padding: 4vw 2.2vw;
    display: flex;
    flex-direction: column;
    gap: 1.4vw;
    pointer-events: none; /* 完全收起时不拦截左侧 3D 操作，由 JS 跟手时恢复 auto */
    will-change: transform;
  }
  #drawerTitle {
    font-size: 2.2vw;
    letter-spacing: 0.2vw;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    margin-bottom: 0.6vw;
  }
  /* 抽屉内部滚动容器：标题/关闭按钮固定不动，其余内容超长时向下滚动查看 */
  #drawerScroll {
    flex: 1 1 auto;
    min-height: 0; /* flex 子项允许收缩，溢出触发滚动 */
    overflow-y: auto;
    scrollbar-width: none;      /* Firefox 隐藏滚动条 */
    -ms-overflow-style: none;   /* IE/Edge 隐藏滚动条 */
    display: flex;
    flex-direction: column;
    gap: 1.4vw;
  }
  #drawerScroll::-webkit-scrollbar { display: none; }
  #drawer .skyBtn { width: 100%; text-align: center; }
  /* v1.67：场景切换按钮（daylight/twilight/night）缩短并排同一行（横向），宽度自动均分 */
  #drawerSceneWrap { display: flex; flex-direction: row; gap: 0.8vw; }
  #drawerSceneWrap .skyBtn { width: auto; flex: 1 1 0; min-width: 0; padding: 0.9vw 0.3vw; font-size: 1.3vw; letter-spacing: 0.06vw; }
  /* v2.1：自由调色盘（设置页改车身颜色） */
  #paintPaletteWrap { margin-top: 1.4vw; }
  #paintPaletteTitle { font-size: 1.3vw; color: rgba(230,230,230,0.9); margin-bottom: 0.6vw; letter-spacing: 0.06vw; }
  #paintPaletteRow { display: flex; flex-direction: row; gap: 0.8vw; align-items: center; }
  #paintColorPicker { width: 4vw; min-width: 36px; height: 2.6vw; min-height: 26px; padding: 0; border: none; background: transparent; cursor: pointer; }
  #paintPaletteRow .skyBtn { width: auto; flex: 1 1 0; min-width: 0; padding: 0.9vw 0.3vw; font-size: 1.3vw; }
  /* v28：自定义页"车辆控制"开关区（车灯/充电/频谱，与车门开关同风格） */
  #viewSwitchWrap {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.4vw;
    padding: 1vw 1.2vw;
    display: flex;
    flex-direction: column;
    gap: 0.7vw;
  }
  #viewSwitchTitle {
    font-size: 1.15vw;
    letter-spacing: 0.1vw;
    color: rgba(255,255,255,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.18);
    padding-bottom: 0.5vw;
  }
  /* v2.2：车门开关区（与调色盘同风格，3x2 网格 + 全部开关快捷行） */
  #doorSwitchWrap { margin-top: 1.4vw; }
  #doorSwitchTitle { font-size: 1.3vw; color: rgba(230,230,230,0.9); margin-bottom: 0.6vw; letter-spacing: 0.06vw; }
  #doorSwitchGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8vw; }
  #doorSwitchGrid .skyBtn { width: auto; min-width: 0; padding: 0.9vw 0.3vw; font-size: 1.3vw; }
  #doorSwitchGrid .skyBtn.on { background: rgba(255,210,120,0.26); border-color: rgba(255,210,120,0.75); color: #ffd98a; }
  #doorSwitchAllRow { display: flex; flex-direction: row; gap: 0.8vw; margin-top: 0.8vw; }
  #doorSwitchAllRow .skyBtn { flex: 1 1 0; min-width: 0; padding: 0.9vw 0.3vw; font-size: 1.3vw; }
  /* 微信扫码绑定激活二维码展示区（设置浮窗内，红绿灯按钮下方） */
  #lightQrBox {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1vw;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.6vw;
    padding: 1.4vw;
  }
  #lightQrImg {
    width: 20vw;
    height: 20vw;
    border-radius: 0.8vw;
    background: #ffffff;
    object-fit: contain;
  }
  #lightQrStatus {
    font-size: 1.15vw;
    letter-spacing: 0.08vw;
    color: rgba(255,255,255,0.92);
    text-align: center;
    line-height: 1.4;
  }
  #drawerCloseBtn {
    position: absolute; top: 2.4vw; right: 2.4vw;
    width: 4.4vw; height: 4.4vw;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 50%;
    font-size: 2.2vw;
    line-height: 1;
    cursor: pointer;
    z-index: 1;
  }
  /* v1.40：ADB 车辆数据连接配置区（设置页场景选择上方） */
  #adbConfigWrap {
    display: flex;
    flex-direction: column;
    gap: 0.8vw;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.6vw;
    padding: 1.2vw;
  }
  #adbConfigTitle {
    font-size: 1.3vw;
    letter-spacing: 0.12vw;
    color: rgba(255,255,255,0.92);
  }
  #adbRow {
    display: flex;
    gap: 0.8vw;
    align-items: center;
  }
  #adbHost, #adbPort {
    min-width: 0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 0.8vw;
    color: rgba(255,255,255,0.95);
    font-size: 1.1vw;
    padding: 0.5vw 0.7vw;
    outline: none;
    box-sizing: border-box;
  }
  #adbHost { flex: 2 1 auto; }
  #adbPort { flex: 1 1 auto; }
  #adbToggleBtn {
    width: 100%;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.92);
    border-radius: 1.2vw;
    font-size: 1.15vw;
    padding: 0.7vw 0;
    cursor: pointer;
  }
  #adbToggleBtn.on {
    background: rgba(46,160,67,0.55);
    border-color: rgba(46,160,67,0.9);
    color: #ffffff;
  }
  #adbStateText {
    font-size: 0.95vw;
    color: rgba(255,255,255,0.65);
    text-align: center;
    letter-spacing: 0.05vw;
  }
  /* v1.40：关闭应用按钮（抽屉最底部，红色风格） */
  #drawerExitBtn {
    width: 100%;
    text-align: center;
    border: 1px solid rgba(230,60,60,0.55);
    background: rgba(200,40,40,0.28);
    color: #ff8b8b;
    border-radius: 1.2vw;
    font-size: 1.15vw;
    padding: 0.7vw 0;
    cursor: pointer;
  }
  /* v1.40：车辆参数页面（同抽屉内切换视图） */
  /* v1.42：与 #drawerScroll 同等滚动能力（overflow-y 滚动 + 底部留白），保证全部参数可滚动查看 */
  #paramPage {
    display: none;
    flex-direction: column;
    gap: 1vw;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 3vw; /* v1.42：底部留白，最后一行参数不被容器边缘截断 */
  }
  #paramPage::-webkit-scrollbar { display: none; }
  #paramBackBtn {
    align-self: flex-start;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.95);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 1.2vw;
    font-size: 1.2vw;
    padding: 0.5vw 1.4vw;
    cursor: pointer;
  }
  #paramHint {
    font-size: 1.05vw;
    color: rgba(255,255,255,0.6);
    text-align: center;
    padding: 2vw 0;
  }
  #paramGroups {
    display: none;
    flex-direction: column;
    gap: 1vw;
  }
  .paramGroup {
    background: rgba(0,0,0,0.45);

  <script>
    (function () {
      'use strict';

      // v33：全局未捕获异常捕获（含堆栈）输出到 logcat，用于定位渲染循环异常源
      window.addEventListener('error', function (ev) {
        try {
          var st = '';
          if (ev && ev.error && ev.error.stack) st = ev.error.stack.split('\n').slice(0, 10).join(' | ');
          if (window.console) console.error('[WINERR] ' + (ev && ev.message ? ev.message : '') + (st ? ' STACK=' + st : ''));
        } catch (e2) { }
      });

      var container = document.getElementById('container');
      var statusEl = document.getElementById('status');
      var debugEl = document.getElementById('debug');

      // ===== P7Show_Next 阶段一：原生 Filament 渲染层接管（JS bridge 适配） =====
      // WebView DOM UI 全部保留；Three.js 车模/天空渲染在 NATIVE 模式下停用，
      // 渲染改由底层 Filament SurfaceView 完成，渲染操作经 AndroidFilament 桥转发。
      var NATIVE = (typeof AndroidFilament !== 'undefined' && AndroidFilament.hasNativeLayer());
      var nativeLastX = 0, nativeLastY = 0;
      // v2.1：镜像原生 Filament 相机状态（yaw/pitch/distance 与 FilamentRenderer 初始值一致，center=(0,0.78,0)），
      // 用于把 Three.js 相机同步到原生视角，保证 3D 歌词精灵 lyricSprite3D 随车模球面环绕（不再退化为 2D 固定）。
      // v2.0.2 修复：nativeYaw/nativePitch/nativeDist 与 syncNativeCamera() 必须为全局作用域。
      // 原先声明在 if(NATIVE) 块内（strict 下为块级作用域），而 pointermove/wheel/touchmove/充电/归位等
      // 调用点位于块外，导致 ReferenceError: syncNativeCamera is not defined，相机同步永不执行。
      var nativeYaw = 38 * Math.PI / 180;
      var nativePitch = 0.24;
      var nativeDist = 7.2;
      var nativeBaseYaw = nativeYaw, nativeBasePitch = nativePitch, nativeBaseDist = nativeDist;
      var nativeChargeSaved = false;
      function syncNativeCamera() {
        if (!camera) return;
        var h = nativeDist * Math.cos(nativePitch);
        camera.position.set(Math.sin(nativeYaw) * h, 0.78 + nativeDist * Math.sin(nativePitch), -Math.cos(nativeYaw) * h);
        camera.lookAt(0, 0.78, 0);
      }
      if (NATIVE) {

      // v1.65：充电信息模块（红绿灯上方、续航条下方）——充电功率/电压/电流；数据源 window.__adbSnapshot（obcVolt/obcCur/dccsCurr，AdbClient 已解析推送）；

      // ---------- 红绿灯倒计时（路径A：Android 原生层推送 window.__lightData / __lightActivateResult） ----------

      var lightCardEl = null, lightDotEl = null, lightTextEl = null;

      function initLightCard() {

      var dMapOn = false;

        isTweening = false; // 动画接管相机，暂停默认视角归位
        if (NATIVE && typeof AndroidFilament !== 'undefined') {

            mode: 'native', t0: performance.now(), dur: 1500,
            fromYaw: nativeYaw, fromPitch: nativePitch, fromDist: nativeDist,
            toYaw: 0, toPitch: 60 * Math.PI / 180, toDist: 15, // 车尾正后方、俯仰60°、距离最远（原生 dist 上限 15）
            onDone: dMapHomeExec
          };
        } else {
          dMapAnim = {
            mode: 'three', t0: performance.now(), dur: 1500,
            fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
            toPos: fly.pos, toTarget: fly.target, onDone: dMapHomeExec
          };
        }
        controls.enabled = false;
        return true;
      }
      // 过渡动画终点：车尾正后方（-z）、俯仰 60°、距离拉到最远（可见包围盒对角线的 2 倍 N 档距离）
      function dMapFlyTarget() {
        if (!model) return null;
        var box = getVisibleBounds(model);
        if (box.isEmpty()) return null;
        var c = box.getCenter(new THREE.Vector3());
        var sz = box.getSize(new THREE.Vector3());
        var ang = 60 * Math.PI / 180;
        var dir = new THREE.Vector3(0, Math.sin(ang), -1).normalize(); // 车尾正后方 + 上抬 60°
        var d = Math.max(sz.length() / 2 * 2.6, 3) * 2.6; // 最远：N 档基础距离 ×2（比全部 6 情况默认视角都远）
        return { pos: c.clone().addScaledVector(dir, d), target: c.clone() };
      }
      function dMapHomeExec() { try { window.AndroidAdbBridge.execShell(getScreenMode() === '13' ? 'am start -a android.intent.action.MAIN -c android.intent.category.HOME' : 'input keyevent KEYCODE_HOME'); } catch (e) { /* 执行异常不阻塞 */ } }
      // 过渡动画逐帧推进（主循环 animate 每帧调用）：NATIVE 走原生相机增量，Three.js 走相机 lerp

          }

            targets[i] = 0.1;
          }
        }

        var hmax = Math.max(4, Math.round(H * 0.98));
        var baseH = Math.max(1, Math.round(H * 0.02)); // 极矮基线：常态/静音时仍可见

      /** 解析 LRC：支持 [mm:ss]、[mm:ss.xx]、[mm:ss:xx]；同一行多标签展开多行；元信息行 [ar:..] 等跳过 */

        } catch (e) { /* 解析失败不阻塞渲染 */ }
      }

      // ---------- 窗口适配 ----------
      function onResize() {
        // v33：切屏瞬间 WebView 布局未更新时 innerWidth/Height 可能为 0 或旧值，
        // 直接除零得 NaN 投影、canvas 像素尺寸错位 → 跳过，由 animate 的模式变化分支用 canvas 实际尺寸自愈
        var _iw = window.innerWidth, _ih = window.innerHeight;
        if (_iw < 10 || _ih < 10) return;
        camera.aspect = _iw / _ih;
        camera.updateProjectionMatrix();
        renderer.setSize(_iw, _ih);
        sizeFreqCanvas();
        updateLyricPanelVisibility();
        DRAWER_W_PX = drawerWidthPx(); // v28：抽屉宽度按分屏模式自适应
        applyDrawerTransform(); // 按新宽度重算浮窗位置（保持当前展开比例）
        if (model) { computeHomePose(); computeAllCasePoses(); } // 屏幕尺寸变化时按新视口重算归位目标（含 6 情况默认视角）
      }
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });

      // ---------- 渲染循环 ----------
      function animate() {
        requestAnimationFrame(animate);
        // v33：渲染循环整体保护——任一环节异常不得中断 rAF（异常被捕获后下一帧继续渲染，根治“卡死”），
        // 同时输出 [ANIMATE_ERR] 堆栈到 logcat 供后续精确修复
        try {
        if (doorAnimRunning) doorTick(performance.now()); // 方案A：推进车门/前盖/尾箱铰链缓动
        dMapTick(); // v2.x：D档地图过渡动画逐帧推进（NATIVE 原生相机 / Three.js 相机双路径）
        drawFreq();
        pollLyricData();      // 轮询原生推送的歌词数据（内容变化才处理）
        pollLightData();      // 轮询原生推送的红绿灯数据（500ms 节流）
        updateLyricHighlight(); // 按本地时钟推进高亮当前行
        updateLyricPanelVisibility(); // 横竖屏切换兜底（旋转未触发 resize 时）
        updateLyricFollowPose(); // v34：歌词跟随镜头视角每帧刷新（开关开启时）
        // 实时按当前宽高比/分屏模式选择归位方案：状态（竖屏/横屏/三分屏/七分屏/全屏）变化时立即重算默认视角目标
        // （窗口尺寸变化本身走 onResize；此处在未触发 resize 的旋转/切屏场景下兜底）
        var portraitNow = window.innerHeight > window.innerWidth;
        var screenModeNow = getScreenMode();
        if (portraitNow !== lastPortrait || screenModeNow !== lastScreenMode) {
          lastPortrait = portraitNow;
          lastScreenMode = screenModeNow;
          console.log('[CASE] mode change portrait=' + portraitNow + ' screenMode=' + screenModeNow + ' custom=' + (caseCustomSet[getCaseKey()] ? 1 : 0) + ' inner=' + window.innerWidth + 'x' + window.innerHeight + ' screen=' + (window.screen ? window.screen.width : 0) + ' dpr=' + (window.devicePixelRatio || 1));
          // v28：三分屏窄屏适配（抽屉宽度/字号）随模式切换 body class
          if (screenModeNow === '13') document.body.classList.add('split-13');
          else document.body.classList.remove('split-13');
          // v33：以 canvas 实际 CSS 尺寸重设投影与渲染尺寸——切屏瞬间 onResize 可能拿旧尺寸/0 尺寸，
          // 导致 canvas 像素尺寸与显示尺寸错位（画面拉伸）；此处在模式变化后一帧内自愈
          var _cw = renderer.domElement.clientWidth, _ch = renderer.domElement.clientHeight;
          if (_cw > 0 && _ch > 0) {
            camera.aspect = _cw / _ch;
            camera.updateProjectionMatrix();
            renderer.setSize(_cw, _ch);
          }
          if (model) {
            computeAllCasePoses();
            // v33：屏幕模式变化时应用新情况的默认视角（此前只重算目标不应用 → 切全屏视角不变）
            // 仅在该情况未设置自定义视角时归位，尊重用户自定义
            // v48：门联动激活时保持联动视角并按新屏幕比例重算，不让档位/分屏默认视角抢占
            if (doorLinkActive) {
              applyDoorLinkView(doorLinkPrio);
            } else if (!caseCustomSet[getCaseKey()]) applyCaseDefault(getCaseKey());
          }
        }
        // 归位（v28：按 6 情况选择——P档/非P档 × 三分屏/七分屏/全屏，各自独立默认/自定义视角）
        // v1.55：充电场景激活时目标固定为充电正左侧镜头（chargeHomePos/chargeHomeTarget，忽略自定义视角）
        // v48：门联动优先——门全关恢复中（doorLinkRestoreActive）或门联动激活（doorLinkActive）时覆盖档位/自定义归位目标
        var curKey = getCaseKey();
        var homePP, homeTP, custPP, custTP, custSetP, hP, hT;
        if (doorLinkRestoreActive) {
          hP = doorLinkRestorePos;
          hT = doorLinkRestoreTarget;
        } else if (doorLinkActive) {
          hP = doorLinkPos;
          hT = doorLinkTarget;
        } else {
          homePP = chargeSceneActive ? chargeHomePos : caseDefaultPos[curKey];
          homeTP = chargeSceneActive ? chargeHomeTarget : caseDefaultTarget[curKey];
          custPP = chargeSceneActive ? chargeHomePos : caseCustomPos[curKey];
          custTP = chargeSceneActive ? chargeHomeTarget : caseCustomTarget[curKey];
          custSetP = chargeSceneActive ? true : caseCustomSet[curKey];
          hP = custSetP ? custPP : homePP;
          hT = custSetP ? custTP : homeTP;
        }
        if (isTweening) {
          // v33：目标防御——hP/hT 必须为有效向量，否则立即结束缓动，杜绝 NaN/undefined 锁死 controls
          if (hP && hT && isFinite(hP.x) && isFinite(hP.y) && isFinite(hP.z) && isFinite(hT.x) && isFinite(hT.y) && isFinite(hT.z)) {
            if (!tweenLogged) { tweenLogged = true; console.log('[CASE] tween running target=' + hP.x.toFixed(2) + ',' + hP.y.toFixed(2) + ',' + hP.z.toFixed(2) + ' cam=' + camera.position.x.toFixed(2) + ',' + camera.position.y.toFixed(2) + ',' + camera.position.z.toFixed(2)); }
            camera.position.lerp(hP, 0.06);
            controls.target.lerp(hT, 0.06);
            camera.lookAt(controls.target);
            if (camera.position.distanceTo(hP) < 0.02 && controls.target.distanceTo(hT) < 0.02 || performance.now() - tweenStartTs > 3000) { // v31：3s 超时强制结束，防 NaN 目标永不收敛锁死 controls
              camera.position.copy(hP);
              controls.target.copy(hT);
              camera.lookAt(controls.target);
              controls.update();
              isTweening = false;
              controls.enabled = true;
              resetTimer();
              if (doorLinkRestoreActive) doorLinkRestoreActive = false; // v48：门全关恢复缓动到达目标后清除标志，恢复正常归位
              console.log('[CASE] tween end cam=' + camera.position.x.toFixed(2) + ',' + camera.position.y.toFixed(2) + ',' + camera.position.z.toFixed(2) + ' target=' + hP.x.toFixed(2) + ',' + hP.y.toFixed(2) + ',' + hP.z.toFixed(2));
            }
          } else {
            isTweening = false;
            controls.enabled = true;
            if (tweenLogged) console.log('[CASE] tween abort invalid target');
          }
        } else {
          controls.update();
        }
        // 浮窗展开/收起动画推进（JS 驱动，逐帧联动 3D）
        if (drawerAnim) {
          var dk = (performance.now() - drawerAnim.t0) / drawerAnim.dur;
          if (dk >= 1) dk = 1;
          var de = 1 - Math.pow(1 - dk, 3); // easeOutCubic
          drawerRatio = drawerAnim.from + (drawerAnim.to - drawerAnim.from) * de;
          if (dk >= 1) { drawerRatio = drawerAnim.to; drawerAnim = null; }
          applyDrawerTransform();
        }
        // 浮窗联动已移除（v3）：不移动相机与车模，OrbitControls 保持自由
        renderer.render(scene, camera);
        } catch (err) {
          if (window.console) console.error('[ANIMATE_ERR] ' + (err && err.message) + ' STACK=' + (err && err.stack ? err.stack.split('\n').slice(0, 8).join(' | ') : ''));
        }
      }

      buildLights();
      createWater(); // 水面平面 y≈0（半透明蓝灰，高金属低粗糙）
      // v2.1：NATIVE 启动即同步当前天空球到原生 Filament（默认 daylight；若随时间同步已切换则走 switchSky 已同步）
      if (NATIVE && typeof AndroidFilament !== 'undefined') AndroidFilament.setSky(currentSkyKey);
      loadEXRScene(currentSkyKey); // 预加载当前场景天空球（启动时若随时间同步已切到目标场景，则按该场景加载并缓存）
      initAudioSpectrum();
      initLyricPanel();
      initLightCard();
      // ---------- 顶部安全区：全屏沉浸后系统悬浮图标（头像/电量/wifi）与顶部内容重叠，
      // ---------- 通过 AndroidAudioBridge.getStatusBarHeight() 获取状态栏高度换算 vw 偏移，
      // ---------- 将 #clock / #lightCard / #lyricPanel 的 top 在原有 vw 基础上整体下移 ----------
      // v37：顶栏统一七分屏标准 + 安全区修复。
      // 背景：顶栏元素原全部用 vw（相对视口宽），三分屏视口窄→字号/间距偏小、全屏视口宽→偏大；
      //       安全区 vw 按物理屏宽(screen.width)换算，在分屏下实际下移不足，导致左上信息被系统头像遮挡。
      // 方案：以七分屏标准视口宽 stdW = (screen.width/dpr)*0.7 为基准，顶栏各元素
      //       top/left/字号/间距统一换算为物理 px（三分屏/全屏/七分屏三模式视觉一致）；
      //       安全区偏移 = 状态栏物理高度 / dpr 的 CSS px，直接叠加在 top 上；
      //       日期模块（#clockWeek/#clockDay）三分屏保持原大小不放大，其余模式对齐七分屏。
      function applyStatusBarSafeArea() {
        var iw = window.innerWidth, ih = window.innerHeight;
        if (iw < 10 || ih < 10) return; // 切屏瞬间布局未更新，保持上次值
        var dpr = window.devicePixelRatio || 1;
        var physW = (window.screen && window.screen.width) ? window.screen.width : iw * dpr;
        var cssW = physW > 0 ? physW / dpr : iw;
        var stdW = cssW * 0.7; // 七分屏标准视口宽（CSS px）
        var mode = getScreenMode();
        var sbPx = 32; // 兜底：桥调用失败或返回 0 时取 32px（物理像素）
        try {
          if (window.AndroidAudioBridge && typeof window.AndroidAudioBridge.getStatusBarHeight === 'function') {
            var sb = parseInt(window.AndroidAudioBridge.getStatusBarHeight(), 10);
            if (sb && sb > 0) sbPx = sb;
          }
        } catch (e) { /* 异常保持兜底 */ }
        var sbCss = sbPx / dpr; // 状态栏偏移转 CSS px
        function vwPx(v) { return (v / 100) * stdW; } // 七分屏标准宽下 vw→px
        var topW = (mode === '13') ? iw : stdW; // v39：三分屏纵向间距按当前视口宽（原 CSS vw 比例，收紧红绿灯/导航/续航模块间距），其余模式七分屏标准宽
        var topPx = function (baseVw) { return (baseVw / 100 * topW + sbCss) + 'px'; };
        var leftPx = function (baseVw) { return vwPx(baseVw) + 'px'; };
        var fsPx = function (baseVw) { return vwPx(baseVw) + 'px'; };
        var lcPx = function (baseVw) { return (baseVw / 100 * topW) + 'px'; }; // v41：红绿灯卡尺寸与 top 同基准（三分屏按 iw 同步缩放，避免卡片高度相对过大压住下方时钟）
        // v46：七分屏/全屏左上信息区优化（三分屏不受影响）——时间/日期字号减半、续航/电量字号 0.6 倍、信息区整体上移贴近状态栏
        var not13 = (mode !== '13');
        var lift = not13 ? 1.4 : 0; // 信息区上移量（基准 vw）：rangeModule 2.2→0.8，lightCard 10→8.6，clock 15→13.6（v1.67：充电信息已移至底部频谱条上方，不再参与 top 布局）
        var rScale = not13 ? 0.6 : 1; // 续航/电量字号与间距 0.6 倍
        var tScale = not13 ? 0.5 : 1; // 时间/日期字号与间距 0.5 倍
        // 续航/电量模块（v38：三分屏整体缩小 0.5 倍——字号/间距/电量条等比减半，其余模式保持 v37 值）
        var rangeModule = document.getElementById('rangeModule');
        if (rangeModule) { rangeModule.style.top = topPx(2.2 - lift); rangeModule.style.left = leftPx(2.4); }
        var rk = (mode === '13') ? 0.5 : 1; // 三分屏缩放系数 0.5
        var rangeVal = document.getElementById('rangeVal');
        if (rangeVal) rangeVal.style.fontSize = fsPx(4.08 * rk * rScale);
        var rangeUnit = document.getElementById('rangeUnit');
        if (rangeUnit) rangeUnit.style.fontSize = fsPx(2.4 * rk * rScale);
        var rangeBattPct = document.getElementById('rangeBattPct');
        if (rangeBattPct) { rangeBattPct.style.fontSize = fsPx(2.64 * rk * rScale); rangeBattPct.style.marginLeft = vwPx(2 * rk * rScale) + 'px'; }
        var rangeSub = document.getElementById('rangeSub');
        if (rangeSub) { rangeSub.style.marginTop = vwPx(0.8 * rk * rScale) + 'px'; rangeSub.style.gap = vwPx(1 * rk * rScale) + 'px'; }
        var rangeMain = document.getElementById('rangeMain');
        if (rangeMain) rangeMain.style.gap = vwPx(0.9 * rk * rScale) + 'px';
        var rangeBar = document.getElementById('rangeBar');
        if (rangeBar) { rangeBar.style.width = vwPx(22.5 * rk * rScale) + 'px'; rangeBar.style.height = vwPx(0.65 * rk * rScale) + 'px'; rangeBar.style.borderRadius = vwPx(0.325 * rk * rScale) + 'px'; }
        // 充电信息模块
        var chargeInfoModule = document.getElementById('chargeInfoModule');
        if (chargeInfoModule) { chargeInfoModule.style.left = leftPx(2.4); chargeInfoModule.style.bottom = (Math.max(40, Math.round(ih / 5)) + 12) + 'px'; chargeInfoModule.style.fontSize = fsPx(1.58); chargeInfoModule.style.gap = vwPx(2.4) + 'px'; } // v1.67：充电信息改为底部定位（bottom = 频谱条高(约 1/5 屏高) + 12px，与 sizeFreqCanvas 同口径）
        if (chargeInfoModule) {
          var chargeItems = chargeInfoModule.querySelectorAll('.chargeInfoItem');
          for (var ci = 0; ci < chargeItems.length; ci++) chargeItems[ci].style.gap = vwPx(0.8) + 'px';
          var chargeLabels = chargeInfoModule.querySelectorAll('.chargeInfoLabel');
          for (var cl = 0; cl < chargeLabels.length; cl++) chargeLabels[cl].style.fontSize = fsPx(1.02);
        }
        // 红绿灯卡
        var lightCard = document.getElementById('lightCard');
        if (lightCard) { lightCard.style.top = topPx(10 - lift); lightCard.style.left = leftPx(2.4); lightCard.style.fontSize = lcPx(1.35); lightCard.style.gap = lcPx(0.7) + 'px'; lightCard.style.padding = lcPx(0.7) + 'px ' + lcPx(1.2) + 'px'; lightCard.style.borderRadius = lcPx(1.4) + 'px'; lightCard.style.letterSpacing = lcPx(0.08) + 'px'; }
        var lightDot = document.getElementById('lightDot');
        if (lightDot) { lightDot.style.width = lcPx(1.5) + 'px'; lightDot.style.height = lcPx(1.5) + 'px'; }
        // 时钟：时间字号对齐七分屏；日期模块三分屏保持原大小不放大，其余模式对齐七分屏
        var clock = document.getElementById('clock');
        if (clock) { clock.style.top = topPx(15 - lift); clock.style.left = leftPx(2.4); }
        var clockTime = document.getElementById('clockTime');
        if (clockTime) {
          var timeW = (mode === '13') ? iw : stdW; // v38：三分屏时间字号与日期模块一致（用当前视口宽 iw），其余模式七分屏标准宽
          clockTime.style.fontSize = (5.6 * tScale / 100 * timeW) + 'px';
        }
        var clockDate = document.getElementById('clockDate');
        if (clockDate) { clockDate.style.gap = (0.3 * tScale / 100 * topW) + 'px'; clockDate.style.marginTop = (0.6 * tScale / 100 * topW) + 'px'; } // v39：三分屏按 iw 收紧日期与时间间距
        var dateW = (mode === '13') ? iw : stdW; // 三分屏日期模块用当前视口宽（保持原大小），其余用七分屏标准宽
        var dateFs = function (v) { return (v / 100 * dateW) + 'px'; };
        var clockWeek = document.getElementById('clockWeek');
        if (clockWeek) clockWeek.style.fontSize = dateFs(2.6 * tScale);
        var clockDay = document.getElementById('clockDay');
        if (clockDay) clockDay.style.fontSize = dateFs(5.6 * tScale);
        // 歌词面板（保持安全区下移）
        var lyricPanel = document.getElementById('lyricPanel');
        if (lyricPanel) lyricPanel.style.top = topPx(1);
        // 设置抽屉 #drawer：整体下移安全区，避免标题/场景按钮/灯光按钮与顶部系统悬浮图标重叠
        var safeVw = sbCss / (iw / 100); // 视口宽换算（CSS px → vw），分屏下同样按当前视口计算
        var drawer = document.getElementById('drawer');
        if (drawer) drawer.style.paddingTop = (4 + safeVw) + 'vw';
        var drawerClose = document.getElementById('drawerCloseBtn');
        if (drawerClose) drawerClose.style.top = (2.4 + safeVw) + 'vw';
      }
      applyStatusBarSafeArea();
      window.addEventListener('resize', applyStatusBarSafeArea);
      animate();
    })();
  </script>
</body>
